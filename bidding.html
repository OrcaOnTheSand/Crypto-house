<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Place a Bid - Auction House</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container mt-5">
    <h2 class="mb-4 text-center">Live Auctions</h2>
    <div class="row">
      <div class="col-md-6 mb-4">
        <div class="card">
          <img src="images/bidding1.jpg" class="card-img-top" alt="Auction Item">

          
          <div class="card-body">
            <h5 class="card-title">Antique Clock</h5>
            <p class="card-text">Current bid: 0.03 BTC</p>
            <input type="text" class="form-control mb-2" placeholder="Enter your bid (BTC)" />
            <button class="btn btn-success btn-block">Place Bid</button>
          </div>
        </div>
      </div>

      <div class="col-md-6 mb-4">
        <div class="card">
          <img src="images/bidding2.jpg" class="card-img-top" alt="Auction Item 2">
 
          
          <div class="card-body">
            <h5 class="card-title">Vintage Camera</h5>
            <p class="card-text">Current bid: 0.045 BTC</p>
            <input type="text" class="form-control mb-2" placeholder="Enter your bid (BTC)" />
            <button class="btn btn-success btn-block">Place Bid</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
